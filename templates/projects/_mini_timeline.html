<div class="overflow-x-auto"><div class="min-w-[480px]"><div class="grid grid-cols-[160px_1fr] border-b p-3 text-xs text-muted-foreground"><span>Phase</span><div class="flex justify-between"><span>{{ timeline_start|date:"d M Y" }}</span><span>{{ timeline_end|date:"d M Y" }}</span></div></div>{% for row in mini_timeline_rows %}<div class="grid grid-cols-[160px_1fr] items-center border-b p-3 text-xs"><span class="pr-3 font-normal">{{ row.name }}</span><div class="timeline-track"><div class="timeline-bar"
     style="left:{{ row.left }}%;
            width:{{ row.width }}%"><span style="width:{{ row.progress|floatformat:0 }}%"></span></div>{% if timeline_today is not None %}<div class="timeline-today" style="left:{{ timeline_today }}%"></div>{% endif %}</div></div>{% empty %}<p class="p-5 text-sm text-muted-foreground">Tambahkan task untuk melihat timeline phase.</p>{% endfor %}</div></div>
