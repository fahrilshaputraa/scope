<nav class="project-sidebar settings-sidebar" aria-label="Bagian pengaturan">
    <div class="project-sidebar-head">
        <span class="project-sidebar-name">Pengaturan</span>
        <span class="project-sidebar-code">Akun, administrasi, dan panduan</span>
    </div>
    <div class="project-sidebar-nav">
        <a class="project-nav-item{% if active_settings == 'account' %} is-active{% endif %}"
           href="{% url 'identity:settings' %}"
           {% if active_settings == 'account' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
            </svg>
            Akun
        </a>
        {% for item in settings_links %}
            <a class="project-nav-item{% if active_settings == item.key %} is-active{% endif %}"
               href="{{ item.url }}"
               {% if active_settings == item.key %}aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" aria-hidden="true">{{ item.icon|safe }}</svg>
                {{ item.label }}
            </a>
        {% endfor %}
        <a class="project-nav-item{% if active_settings == 'docs' %} is-active{% endif %}"
           href="{% url 'identity:docs' %}"
           {% if active_settings == 'docs' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h6l2 2 2-2h6v15h-6l-2 2-2-2H4zM12 6v15M7 8h2M15 8h2M7 12h2M15 12h2" />
            </svg>
            Panduan
        </a>
    </div>
    {% if active_settings == 'docs' %}{% include "identity/docs/_navigation.html" %}{% endif %}
</nav>
