<fieldset id="{{ widget.attrs.id }}" class="choice-picker" data-choice-picker aria-label="{{ widget.picker_label }}">
  <div class="choice-toolbar"><label class="choice-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input type="search" placeholder="Cari {{ widget.picker_label|lower }}…" aria-label="Cari {{ widget.picker_label|lower }}" data-choice-search autocomplete="off"></label><span data-choice-count aria-live="polite">Pilih yang diperlukan</span></div>
  <div class="choice-options">{% for group_name, options, index in widget.optgroups %}{% for option in options %}<label class="choice-row" data-choice-row><input type="checkbox" name="{{ widget.name }}" value="{{ option.value|stringformat:'s' }}" id="{{ option.attrs.id }}" aria-label="{{ option.label }}"{% if option.selected %} checked{% endif %}{% if widget.attrs.disabled %} disabled{% endif %}><span class="choice-name">{{ option.label }}</span>{% if option.value.instance.pcc_profile %}<span class="choice-role">{{ option.value.instance.pcc_profile.get_role_display }}</span>{% endif %}</label>{% endfor %}{% empty %}<p class="choice-empty">Belum ada pilihan yang tersedia.</p>{% endfor %}<p class="choice-empty" data-choice-empty hidden>Tidak ada hasil. Coba nama atau username lain.</p></div>
  <div class="choice-selection"><span data-choice-summary></span><button type="button" data-choice-clear>Kosongkan pilihan</button></div>
</fieldset>
