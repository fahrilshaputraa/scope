[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcc"
version = "0.1.0"
description = "Project Control Center — internal project management & progress monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=6.1,<6.2",
  "Authlib>=1.8,<2",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
  "openpyxl>=3.1.5",
  "reportlab>=5.0.1",
  "nh3>=0.3.7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]
